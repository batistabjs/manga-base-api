
services:
  app:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    container_name: manga-base-api
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=manga_base_db
      - DB_USER=root
      - DB_PASSWORD=secret
    networks:
      - manga-network

  db:
    image: mysql:8.0
    container_name: manga-db
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=secret
      - MYSQL_DATABASE=manga_base_db
    volumes:
      - ../sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ../sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - manga-network

volumes:
  db-data:

networks:
  manga-network:
